<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ludothèque - Ma Collection</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4F46E5;
      --primary-hover: #4338CA;
      --bg-color: #F8FAFC;
      --card-bg: #FFFFFF;
      --text-main: #0F172A;
      --text-muted: #64748B;
      --border-color: #E2E8F0;
      --badge-bg: #EEF2FF;
      --badge-text: #3730A3;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding-bottom: 40px; }

    header {
      background: linear-gradient(135deg, #4F46E5, #7C3AED);
      color: white;
      padding: 24px 16px;
      text-align: center;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.15);
    }
    header h1 { font-size: 1.6rem; font-weight: 700; margin-bottom: 6px; }
    header p { font-size: 0.9rem; opacity: 0.9; }

    .container { max-width: 1200px; margin: 0 auto; padding: 16px; }

    /* Zone de statut du chargement */
    .status-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 16px 20px;
      text-align: center;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    .spinner {
      width: 20px;
      height: 20px;
      border: 3px solid #E2E8F0;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Panneau de recherche & filtres */
    .filters-panel {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .search-bar { margin-bottom: 14px; }
    .search-bar input {
      width: 100%;
      padding: 12px 16px;
      font-size: 1rem;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      outline: none;
    }
    .search-bar input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,70,229,0.1); }

    .filter-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
    }
    .filter-group label { display: block; font-size: 0.75rem; font-weight: 600; color: var(--text-muted); margin-bottom: 4px; text-transform: uppercase; }
    .filter-group select, .filter-group input {
      width: 100%;
      padding: 8px 10px;
      font-size: 0.85rem;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background: white;
    }

    .reset-btn {
      margin-top: 12px;
      width: 100%;
      padding: 8px;
      background: #F1F5F9;
      color: var(--text-muted);
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .reset-btn:hover { background: #E2E8F0; color: var(--text-main); }

    /* Info résultats */
    .stats-bar { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 16px; font-weight: 500; display: flex; justify-content: space-between; align-items: center; }

    /* Grille de cartes */
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }
    .game-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .game-card:hover { transform: translateY(-2px); box-shadow: 0 8px 16px rgba(0,0,0,0.06); }
    .game-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 8px; }
    .game-title { font-size: 1.1rem; font-weight: 700; color: var(--text-main); line-height: 1.3; }
    .game-type { font-size: 0.7rem; font-weight: 600; text-transform: uppercase; padding: 4px 8px; background: var(--badge-bg); color: var(--badge-text); border-radius: 20px; white-space: nowrap; }

    .game-meta { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 12px; display: flex; flex-wrap: wrap; gap: 12px; }
    .game-meta-item { display: flex; align-items: center; gap: 4px; }

    .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: auto; }
    .tag { font-size: 0.7rem; background: #F1F5F9; color: #475569; padding: 3px 7px; border-radius: 4px; }
    .tag-theme { background: #FEF3C7; color: #92400E; }
    .tag-mechanism { background: #E0E7FF; color: #3730A3; }

    .details-row { font-size: 0.78rem; color: #64748B; margin-top: 8px; border-top: 1px solid #F1F5F9; padding-top: 8px; }

    @media (max-width: 600px) {
      .filter-grid { grid-template-columns: 1fr 1fr; }
      .search-bar input { font-size: 0.9rem; }
    }
  </style>
</head>
<body>

  <header>
    <h1>🎲 Ma Ludothèque</h1>
    <p>Recherchez et filtrez vos jeux de société</p>
  </header>

  <div class="container">
    <!-- Statut de chargement -->
    <div class="status-card" id="statusCard">
      <div class="spinner" id="statusSpinner"></div>
      <span id="statusText">Chargement automatique de la collection...</span>
    </div>

    <!-- Zone de filtres -->
    <div class="filters-panel">
      <div class="search-bar">
        <input type="text" id="searchTitre" placeholder="🔍 Rechercher par titre de jeu...">
      </div>

      <div class="filter-grid">
        <div class="filter-group">
          <label>Nb de joueur(s)</label>
          <select id="filterJoueurs">
            <option value="">Tous les nombres</option>
            <option value="1">1 joueur (Solo)</option>
            <option value="2">2 joueurs</option>
            <option value="3">3 joueurs</option>
            <option value="4">4 joueurs</option>
            <option value="5">5 joueurs</option>
            <option value="6">6 joueurs</option>
            <option value="7">7 joueurs</option>
            <option value="8">8 joueurs</option>
            <option value="9">9 joueurs</option>
            <option value="10">10 joueurs et +</option>
          </select>
        </div>

        <div class="filter-group">
          <label>Âge</label>
          <select id="filterAge"><option value="">Tous les âges</option></select>
        </div>

        <div class="filter-group">
          <label>Durée</label>
          <select id="filterDuree"><option value="">Toutes les durées</option></select>
        </div>

        <div class="filter-group">
          <label>Thème</label>
          <select id="filterTheme"><option value="">Tous les thèmes</option></select>
        </div>

        <div class="filter-group">
          <label>Mécanisme</label>
          <select id="filterMecanisme"><option value="">Tous les mécanismes</option></select>
        </div>

        <div class="filter-group">
          <label>Auteur</label>
          <input type="text" id="filterAuteur" placeholder="Nom d'auteur...">
        </div>
      </div>

      <button class="reset-btn" onclick="resetFilters()">Réinitialiser tous les filtres</button>
    </div>

    <div class="stats-bar">
      <span id="statsBar">Connexion au serveur...</span>
      <button style="background: none; border: none; color: var(--primary); font-size: 0.8rem; cursor: pointer; text-decoration: underline;" onclick="loadCollectionFromUrl()">Recharger la collection</button>
    </div>

    <!-- Grille des jeux -->
    <div class="games-grid" id="gamesGrid"></div>
  </div>

  <script>
    const EXCEL_URL = 'https://raw.githubusercontent.com/casedepartasso/listejeux/doc/collection.xlsx';
    let rawGamesData = [];

    document.addEventListener('DOMContentLoaded', () => {
      loadCollectionFromUrl();
    });

    async function loadCollectionFromUrl() {
      const statusCard = document.getElementById('statusCard');
      const statusSpinner = document.getElementById('statusSpinner');
      const statusText = document.getElementById('statusText');

      statusCard.style.display = 'flex';
      statusSpinner.style.display = 'block';
      statusText.textContent = 'Téléchargement de la collection depuis le serveur...';

      try {
        const response = await fetch(EXCEL_URL);
        if (!response.ok) throw new Error(`Erreur réseau (${response.status})`);
        
        const arrayBuffer = await response.arrayBuffer();
        const data = new Uint8Array(arrayBuffer);
        const workbook = XLSX.read(data, { type: 'array' });
        const firstSheetName = workbook.SheetNames[0];
        const worksheet = workbook.Sheets[firstSheetName];
        
        rawGamesData = XLSX.utils.sheet_to_json(worksheet);
        
        statusCard.style.display = 'none';
        initApp(rawGamesData);
      } catch (error) {
        console.error('Erreur lors du chargement automatique:', error);
        statusSpinner.style.display = 'none';
        statusText.innerHTML = `<span style="color: #DC2626;">Impossible de charger automatiquement <code>collection.xlsx</code> (${error.message}). Vérifiez votre connexion ou les autorisations CORS.</span>`;
      }
    }

    function initApp(data) {
      attachFilterListeners();
      applyFilters();
    }

    function normalizeAge(str) {
      if (!str) return '';
      const match = String(str).match(/(\d+)/);
      return match ? match[1] + '+' : String(str).trim();
    }

    function normalizeDuree(str) {
      if (!str) return '';
      const strVal = String(str).trim();
      if (strVal.includes('—') || strVal.includes('-')) {
        const parts = strVal.split(/—|-/).map(p => p.trim());
        if (parts.length === 2 && parts[1]) {
          return parts[1];
        }
      }
      return strVal;
    }

    function isPlayerCountValid(playerStr, targetCount) {
      if (!playerStr || targetCount === null || targetCount === undefined) return true;

      const str = String(playerStr).trim();
      const target = parseInt(targetCount, 10);
      if (isNaN(target)) return true;

      if (str.toLowerCase() === 'duo') return target === 2;

      if (str.includes('—') || str.includes('-')) {
        const parts = str.split(/—|-/).map(p => parseInt(p.trim(), 10));
        if (parts.length === 2 && !isNaN(parts[0]) && !isNaN(parts[1])) {
          return target >= parts[0] && target <= parts[1];
        }
      }

      if (str.includes('+')) {
        const minVal = parseInt(str.replace('+', '').trim(), 10);
        if (!isNaN(minVal)) return target >= minVal;
      }

      const exactVal = parseInt(str, 10);
      if (!isNaN(exactVal)) return target === exactVal;

      return true;
    }

    function getActiveFilterValues(excludeId = null) {
      return {
        titre: document.getElementById('searchTitre').value.toLowerCase(),
        joueurs: excludeId === 'filterJoueurs' ? null : (document.getElementById('filterJoueurs').value !== "" ? parseInt(document.getElementById('filterJoueurs').value, 10) : null),
        age: excludeId === 'filterAge' ? '' : document.getElementById('filterAge').value,
        duree: excludeId === 'filterDuree' ? '' : document.getElementById('filterDuree').value,
        theme: excludeId === 'filterTheme' ? '' : document.getElementById('filterTheme').value.toLowerCase(),
        meca: excludeId === 'filterMecanisme' ? '' : document.getElementById('filterMecanisme').value.toLowerCase(),
        auteur: document.getElementById('filterAuteur').value.toLowerCase()
      };
    }

    function gameMatchesFilters(g, filters) {
      const matchTitre = !filters.titre || (g['Titre'] && g['Titre'].toLowerCase().includes(filters.titre));
      const matchJoueurs = filters.joueurs === null || isPlayerCountValid(g['Joueur(s)'], filters.joueurs);
      const matchAge = !filters.age || normalizeAge(g['Age(s)']) === filters.age;
      const matchDuree = !filters.duree || normalizeDuree(g['Durée']) === filters.duree;
      const matchTheme = !filters.theme || (g['Thème(s)'] && g['Thème(s)'].toLowerCase().includes(filters.theme));
      const matchMeca = !filters.meca || (g['Mécanisme(s)'] && g['Mécanisme(s)'].toLowerCase().includes(filters.meca));
      const matchAuteur = !filters.auteur || (g['Auteur(s)'] && g['Auteur(s)'].toLowerCase().includes(filters.auteur));

      return matchTitre && matchJoueurs && matchAge && matchDuree && matchTheme && matchMeca && matchAuteur;
    }

    function updateDropdownCounts() {
      const joueursSelect = document.getElementById('filterJoueurs');
      const currentJoueurVal = joueursSelect.value;
      const filtersExJoueurs = getActiveFilterValues('filterJoueurs');
      const filteredForJoueurs = rawGamesData.filter(g => gameMatchesFilters(g, filtersExJoueurs));

      const joueurOptionsData = [];
      Array.from(joueursSelect.options).forEach(opt => {
        if (opt.value === "") return;
        const val = parseInt(opt.value, 10);
        const count = filteredForJoueurs.filter(g => isPlayerCountValid(g['Joueur(s)'], val)).length;
        const labelBase = opt.value === "1" ? "1 joueur (Solo)" : (opt.value === "10" ? "10 joueurs et +" : `${opt.value} joueurs`);
        joueurOptionsData.push({ value: opt.value, label: labelBase, count: count });
      });

      joueurOptionsData.sort((a, b) => {
        if ((a.count > 0 && b.count > 0) || (a.count === 0 && b.count === 0)) {
          return parseInt(a.value, 10) - parseInt(b.value, 10);
        }
        return b.count - a.count;
      });

      joueursSelect.innerHTML = `<option value="">Tous les nombres (${filteredForJoueurs.length})</option>`;
      joueurOptionsData.forEach(item => {
        const opt = document.createElement('option');
        opt.value = item.value;
        opt.textContent = `${item.label} (${item.count})`;
        if (item.count === 0) {
          opt.disabled = true;
          opt.style.color = '#94A3B8';
        }
        joueursSelect.appendChild(opt);
      });
      joueursSelect.value = currentJoueurVal;

      updateDynamicSelect('filterAge', 'Age(s)', false, 'Tous les âges', normalizeAge);
      updateDynamicSelect('filterDuree', 'Durée', false, 'Toutes les durées', normalizeDuree);
      updateDynamicSelect('filterTheme', 'Thème(s)', true, 'Tous les thèmes');
      updateDynamicSelect('filterMecanisme', 'Mécanisme(s)', true, 'Tous les mécanismes');
    }

    function updateDynamicSelect(selectId, fieldName, isMultiValue, defaultText, transformFn = null) {
      const select = document.getElementById(selectId);
      const currentVal = select.value;
      const filters = getActiveFilterValues(selectId);
      const filteredData = rawGamesData.filter(g => gameMatchesFilters(g, filters));

      const counts = {};
      rawGamesData.forEach(g => {
        if (g[fieldName] !== undefined && g[fieldName] !== null) {
          let rawStr = String(g[fieldName]).trim();
          if (transformFn) rawStr = transformFn(rawStr);
          const items = isMultiValue ? rawStr.split(',').map(s => s.trim()) : [rawStr];
          items.forEach(item => {
            if (item && !counts[item]) counts[item] = 0;
          });
        }
      });

      filteredData.forEach(g => {
        if (g[fieldName] !== undefined && g[fieldName] !== null) {
          let rawStr = String(g[fieldName]).trim();
          if (transformFn) rawStr = transformFn(rawStr);
          const items = isMultiValue ? rawStr.split(',').map(s => s.trim()) : [rawStr];
          items.forEach(item => {
            if (item) counts[item] = (counts[item] || 0) + 1;
          });
        }
      });

      const optionsList = Object.keys(counts).map(key => ({
        name: key,
        count: counts[key]
      }));

      optionsList.sort((a, b) => {
        if ((a.count > 0 && b.count > 0) || (a.count === 0 && b.count === 0)) {
          return a.name.localeCompare(b.name, 'fr', { numeric: true });
        }
        return b.count - a.count;
      });

      select.innerHTML = `<option value="">${defaultText} (${filteredData.length})</option>`;
      optionsList.forEach(item => {
        const opt = document.createElement('option');
        opt.value = item.name;
        opt.textContent = fieldName === 'Durée' ? `${item.name} min (${item.count})` : `${item.name} (${item.count})`;
        if (item.count === 0) {
          opt.disabled = true;
          opt.style.color = '#94A3B8';
        }
        select.appendChild(opt);
      });

      select.value = currentVal;
    }

    function attachFilterListeners() {
      const inputs = ['searchTitre', 'filterJoueurs', 'filterAge', 'filterDuree', 'filterTheme', 'filterMecanisme', 'filterAuteur'];
      inputs.forEach(id => {
        document.getElementById(id).addEventListener('input', applyFilters);
        document.getElementById(id).addEventListener('change', applyFilters);
      });
    }

    function applyFilters() {
      const filters = getActiveFilterValues();
      const filtered = rawGamesData.filter(g => gameMatchesFilters(g, filters));
      
      updateDropdownCounts();
      renderGames(filtered);
    }

    function resetFilters() {
      ['searchTitre', 'filterAuteur'].forEach(id => document.getElementById(id).value = '');
      ['filterJoueurs', 'filterAge', 'filterDuree', 'filterTheme', 'filterMecanisme'].forEach(id => document.getElementById(id).value = '');
      applyFilters();
    }

    function renderGames(data) {
      const grid = document.getElementById('gamesGrid');
      const stats = document.getElementById('statsBar');
      grid.innerHTML = '';
      stats.textContent = `${data.length} jeu(x) trouvé(s)`;

      if (data.length === 0) {
        grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px 0;">Aucun jeu ne correspond à vos critères de recherche.</p>';
        return;
      }

      data.forEach(game => {
        const card = document.createElement('div');
        card.className = 'game-card';

        const themes = game['Thème(s)'] ? String(game['Thème(s)']).split(',').map(t => `<span class="tag tag-theme">${t.trim()}</span>`).join('') : '';
        const mecas = game['Mécanisme(s)'] ? String(game['Mécanisme(s)']).split(',').map(m => `<span class="tag tag-mechanism">${m.trim()}</span>`).join('') : '';

        card.innerHTML = `
          <div>
            <div class="game-header">
              <div class="game-title">${game['Titre'] || 'Sans titre'}</div>
              <div class="game-type">${game['Type'] || 'Jeu'}</div>
            </div>
            <div class="game-meta">
              <span class="game-meta-item">👥 ${game['Joueur(s)'] || 'N/C'}</span>
              <span class="game-meta-item">⏱️ ${game['Durée'] ? game['Durée'] + ' min' : 'N/C'}</span>
              <span class="game-meta-item">🎂 ${game['Age(s)'] || ''}</span>
              ${game['Note moyenne'] ? `<span class="game-meta-item">⭐ ${game['Note moyenne']}</span>` : ''}
            </div>
            <div class="tags">
              ${themes}
              ${mecas}
            </div>
          </div>
          <div class="details-row">
            ${game['Auteur(s)'] ? `<div><strong>Auteur :</strong> ${game['Auteur(s)']}</div>` : ''}
            ${game['Illustrateur(s)'] ? `<div><strong>Illustrateur :</strong> ${game['Illustrateur(s)']}</div>` : ''}
          </div>
        `;
        grid.appendChild(card);
      });
    }
  </script>
</body>
</html>
